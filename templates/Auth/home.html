{% extends 'base.html' %}
{% load static %}

{% block body %}

<div class="search-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 17 9.5 6.5 6.5 0 1 0 9.5 16a6.471 6.471 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14A4.5 4.5 0 1 1 14 9.5 4.505 4.505 0 0 1 9.5 14z"/>
    </svg>
    <input type="text" id="book-search" placeholder="Search by title...">
</div>

<div class="cart-items">
    {% for book in books %}
        {% include 'Auth/book_container.html' with add_to_cart_remove_from_cart='add' %}
    {% endfor %}
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("book-search");
    const cartContainer = document.querySelector(".cart-items");

    let timeout;

    searchInput.addEventListener("input", function () {
        const query = this.value.trim();

        clearTimeout(timeout);

        if (query.length > 0) {
            timeout = setTimeout(() => {
                fetchResults(query);
            }, 300);
        } 
    });

    function fetchResults(query) {
        fetch(`/search_books/?q=${encodeURIComponent(query)}`)
            .then(response => response.json())
            .then(data => {
                if (data && data.results.length > 0) {
                    cartContainer.innerHTML = ""; // Clear current items

                    data.results.forEach(book => {
                        const bookItem = document.createElement("div");
                        bookItem.classList.add("book-item");

                        bookItem.innerHTML = `
                            <img src="${book.image}" alt="${book.title}">
                            <div class="book-details">
                                <h3>${book.title}</h3>
                                <p>Author: ${book.author}</p>
                                <span class="book-price">$${book.cost}</span>
                            </div>
                            <button class="add-to-cart" data-book-id="${book.id}" data-content-type-id="${book.content_type_id}">
                                Add to Cart
                            </button>
                        `;

                        cartContainer.appendChild(bookItem);
                    });

                    attachCartEventListeners();
                }
            })
            .catch(error => console.error("Error fetching search results:", error));
    }

    function attachCartEventListeners() {
        document.querySelectorAll(".add-to-cart").forEach(button => {
            button.addEventListener("click", function () {
                const bookId = this.dataset.bookId;
                const contentTypeId = this.dataset.contentTypeId;
                addToCart(bookId, contentTypeId, this);
            });
        });
    }

    function addToCart(bookId, contentTypeId, button) {
        fetch(`/add_to_cart/${contentTypeId}/${bookId}/`, { 
            method: "POST",
            headers: {
                "X-CSRFToken": getCSRFToken(),  
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ book_id: bookId, content_type_id: contentTypeId })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                button.innerText = "Added!";
                button.disabled = true;
                showNotification("Item added to cart!");
            } else {
                alert(`Failed: ${data.message}`);
            }
        })
        .catch(error => console.error("Error:", error));
    }

    function showNotification(message) {
        const notification = document.createElement("div");
        notification.classList.add("cart-notification");
        notification.innerText = message;

        document.body.appendChild(notification);

        setTimeout(() => {
            notification.style.opacity = "0";
            setTimeout(() => notification.remove(), 500);
        }, 2000);
    }

    function getCSRFToken() {
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]');
        return csrfToken ? csrfToken.value : "";
    }

    attachCartEventListeners();
});

</script>

{% endblock %}
