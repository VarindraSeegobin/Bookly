<div class="book-item">
    <img src="{{ book.image }}" alt="{{ book.title }}">
    <div class="book-details">
        <h3>{{ book.title }}</h3>
        <p>Author: {{ book.author }}</p>
        <span class="book-price">${{ book.cost }}</span>
    </div>

    {% if add_to_cart_remove_from_cart == 'remove' %}
        <form method="post" action="{% url 'cart' %}">
            {% csrf_token %}
            <input type="hidden" name="item_id" value="{{ item_id }}">
            <button type="submit" class="remove-btn">Remove from Cart</button>
        </form>
    {% elif add_to_cart_remove_from_cart != 'order_display' %}
        <button class="add-to-cart" 
            data-book-id="{{ book.id }}" 
            data-content-type-id="{{ book.content_type_id }}">
            Add to Cart
        </button>
    {% else %}
        <p>Quantity: {{ cart_quantity }}</p>
    {% endif %}
</div>
