<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .delete-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn:hover {
            background-color: darkred;
        }
    </style>
    <script>
    function deleteSchool(schoolId) {
        if (confirm("Are you sure you want to delete this school?")) {
            // Get CSRF token from the form or meta tag
            const csrfToken = document.querySelector('[name="csrfmiddlewaretoken"]').value;

            fetch(`/custom-admin/delete_school/${schoolId}/`, {  // Updated URL pattern here
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken, // Include CSRF token in the headers
                },
                body: JSON.stringify({}) // We don't need to send the csrfmiddlewaretoken in the body
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById(`school-${schoolId}`).remove();
                } else {
                    alert('Error deleting school.');
                }
            })
            .catch(() => alert('Something went wrong.'));
        }
    }
</script>

</head>
<body>
    <h2>Schools</h2>
    <!-- CSRF token hidden field -->
    <form method="POST" style="display: none;">
        {% csrf_token %}
    </form>
    <table>
        <thead>
            <tr>
                <th>School Title</th>
                <th>School Name</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for school in schools %}
                <tr id="school-{{ school.id }}">
                    <td>{{ school.title }}</td>
                    <td>{{ school.name }}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteSchool({{ school.id }})">Delete</button>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">No schools available.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
