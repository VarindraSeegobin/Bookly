<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .delete-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn:hover {
            background-color: darkred;
        }
    </style>
    <script>
        function deleteSubject(subjectId) {
            if (confirm("Are you sure you want to delete this subject?")) {
                const csrfToken = document.querySelector('[name="csrfmiddlewaretoken"]').value;

                fetch(`/delete-subject/${subjectId}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ csrfmiddlewaretoken: csrfToken })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById(`subject-${subjectId}`).remove();
                    } else {
                        alert('Error deleting subject.');
                    }
                })
                .catch(() => alert('Something went wrong.'));
            }
        }
    </script>
</head>
<body>
    <h2>Subjects</h2>
    <table>
        <thead>
            <tr>
                <th>School</th>
                <th>Subject</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for subject in subjects %}
                <tr id="subject-{{ subject.id }}">
                    <td>{{ subject.school.name }}</td>
                    <td>{{ subject.name }}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteSubject({{ subject.id }})">Delete</button>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">No subjects available.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
